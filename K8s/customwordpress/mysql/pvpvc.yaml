apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv-volume
spec:
  capacity:
    storage: 30Gi
  storageClassName: cg-storageclass
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.0.25.122
    path: "/mysqldata"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pv-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: cg-storageclass
  resources:
    requests:
      storage: 30Gi
