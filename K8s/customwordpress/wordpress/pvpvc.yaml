apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpressfiles
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteMany
  storageClassName: cg-storageclass
  nfs:
    server: 10.0.25.122
    path: "/wordpressfiles"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpressfiles
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: cg-storageclass
  resources:
    requests:
      storage: 30Gi
